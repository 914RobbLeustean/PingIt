<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PingIt — Prototype</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- React + Babel -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:             #090912;
      --surface:        #12121c;
      --surface2:       #1a1a28;
      --surface3:       #22223a;
      --border:         rgba(255,255,255,0.07);
      --border2:        rgba(255,255,255,0.12);
      --text:           #f0f0f8;
      --text-secondary: #6b6b84;
      --text-muted:     #35354a;
      --accent:         oklch(0.82 0.22 58);
      --hot:            oklch(0.68 0.26 20);
      --live:           oklch(0.78 0.20 145);
    }

    body {
      background: #08080f;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    #root { min-height: 100vh; }

    /* ── Input & textarea placeholder color ── */
    input::placeholder, textarea::placeholder { color: var(--text-secondary); }
    input, textarea { color-scheme: dark; }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 0; }

    /* ── Leaflet overrides ── */
    .leaflet-container { background: #090912; font-family: 'DM Sans', sans-serif; }
    .leaflet-attribution-flag { display: none !important; }
    .leaflet-control-attribution {
      background: rgba(9,9,18,0.7) !important;
      color: #3a3a50 !important;
      font-size: 9px !important;
      padding: 2px 6px !important;
      border-radius: 4px !important;
      backdrop-filter: blur(8px);
    }
    .leaflet-control-attribution a { color: #4a4a65 !important; }

    /* ── Ping Markers ── */
    .pm-wrap {
      position: relative;
      width: 52px;
      height: 52px;
    }
    .pm-pulse {
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      background: oklch(0.82 0.22 58);
      opacity: 0;
      animation: ping-pulse 2.8s ease-out infinite;
      pointer-events: none;
    }
    .pm-p2 { animation-delay: 1.4s; }
    .pm-dot {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: #12121c;
      border: 2.5px solid oklch(0.82 0.22 58);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      box-shadow: 0 0 20px rgba(245,166,35,0.35), 0 4px 16px rgba(0,0,0,0.6);
      cursor: pointer;
    }
    .pm-wrap.hot .pm-dot {
      border-color: oklch(0.68 0.26 20);
      box-shadow: 0 0 20px rgba(220,60,40,0.45), 0 4px 16px rgba(0,0,0,0.6);
    }
    .pm-wrap.hot .pm-pulse { background: oklch(0.68 0.26 20); animation-duration: 1.8s; }
    .pm-wrap.critical .pm-dot { animation: pm-shake 0.6s ease-in-out infinite; }
    .pm-badge {
      position: absolute;
      top: -3px;
      right: -3px;
      background: oklch(0.82 0.22 58);
      color: #000;
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 11px;
      min-width: 20px;
      height: 20px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 4px;
      border: 2px solid #090912;
    }

    /* ── Keyframes ── */
    @keyframes ping-pulse {
      0%   { transform: scale(0.7); opacity: 0.7; }
      100% { transform: scale(2.8); opacity: 0; }
    }
    @keyframes pm-shake {
      0%,100% { transform: translateX(0); }
      25%      { transform: translateX(-2px) rotate(-2deg); }
      75%      { transform: translateX(2px) rotate(2deg); }
    }
    @keyframes radar-ring {
      0%   { transform: scale(0.05); opacity: 0.9; }
      100% { transform: scale(7);    opacity: 0; }
    }
    @keyframes dot-blink {
      0%,100% { opacity: 0; }
      15%,70%  { opacity: 1; }
      90%      { opacity: 0; }
    }
    @keyframes logo-pulse {
      0%,100% { transform: scale(1);    opacity: 0.6; }
      50%     { transform: scale(1.4);  opacity: 0.3; }
    }
    @keyframes fab-glow {
      0%,100% { box-shadow: 0 0 28px rgba(245,166,35,0.55), 0 8px 24px rgba(0,0,0,0.5); }
      50%     { box-shadow: 0 0 44px rgba(245,166,35,0.80), 0 8px 28px rgba(0,0,0,0.5); }
    }
    @keyframes live-pulse {
      0%,100% { opacity: 1; transform: scale(1); }
      50%     { opacity: 0.4; transform: scale(0.75); }
    }
    @keyframes typing-dot {
      0%,100% { transform: translateY(0); opacity: 0.5; }
      50%     { transform: translateY(-4px); opacity: 1; }
    }
  </style>
</head>
<body style="background-color: rgb(0, 0, 0)">
  <div id="root"></div>

  <!-- Data (plain JS, loads first) -->
  <script src="pingit-data.js"></script>

  <!-- Shared UI components -->
  <script type="text/babel" src="pingit-ui.jsx"></script>

  <!-- Screen modules -->
  <script type="text/babel" src="pingit-auth.jsx"></script>
  <script type="text/babel" src="pingit-map.jsx"></script>
  <script type="text/babel" src="pingit-social.jsx"></script>
  <script type="text/babel" src="pingit-user.jsx"></script>

  <!-- App shell (renders last) -->
  <script type="text/babel" src="pingit-app.jsx"></script>
</body>
</html>
