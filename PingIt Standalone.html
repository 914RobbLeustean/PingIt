      font-size: 9px !important;
      padding: 2px 6px !important;
      border-radius: 4px !important;
      backdrop-filter: blur(8px);
    }
    .leaflet-control-attribution a { color: #4a4a65 !important; }

    .pm-wrap { position: relative; width: 52px; height: 52px; }
    .pm-pulse {
      position: absolute; inset: -4px; border-radius: 50%;
      background: oklch(0.82 0.22 58); opacity: 0;
      animation: ping-pulse 2.8s ease-out infinite; pointer-events: none;
    }
    .pm-p2 { animation-delay: 1.4s; }
    .pm-dot {
      position: absolute; inset: 0; border-radius: 50%;
      background: #12121c; border: 2.5px solid oklch(0.82 0.22 58);
      display: flex; align-items: center; justify-content: center;
      font-size: 22px;
      box-shadow: 0 0 20px rgba(245,166,35,0.35), 0 4px 16px rgba(0,0,0,0.6);
      cursor: pointer;
    }
    .pm-wrap.hot .pm-dot {
      border-color: oklch(0.68 0.26 20);
      box-shadow: 0 0 20px rgba(220,60,40,0.45), 0 4px 16px rgba(0,0,0,0.6);
    }
    .pm-wrap.hot .pm-pulse { background: oklch(0.68 0.26 20); animation-duration: 1.8s; }
    .pm-wrap.critical .pm-dot { animation: pm-shake 0.6s ease-in-out infinite; }
    .pm-badge {
      position: absolute; top: -3px; right: -3px;
      background: oklch(0.82 0.22 58); color: #000;
      font-family: 'Syne', sans-serif; font-weight: 800; font-size: 11px;
      min-width: 20px; height: 20px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      padding: 0 4px; border: 2px solid #090912;
    }

    @keyframes ping-pulse {
      0%   { transform: scale(0.7); opacity: 0.7; }
      100% { transform: scale(2.8); opacity: 0; }
    }
    @keyframes pm-shake {
      0%,100% { transform: translateX(0); }
      25%     { transform: translateX(-2px) rotate(-2deg); }
      75%     { transform: translateX(2px) rotate(2deg); }
    }
    @keyframes radar-ring {
      0%   { transform: scale(0.05); opacity: 0.9; }
      100% { transform: scale(7);    opacity: 0; }
    }
    @keyframes dot-blink {
      0%,100% { opacity: 0; }
      15%,70% { opacity: 1; }
      90%     { opacity: 0; }
    }
    @keyframes logo-pulse {
      0%,100% { transform: scale(1);   opacity: 0.6; }
      50%     { transform: scale(1.4); opacity: 0.3; }
    }
    @keyframes fab-glow {
      0%,100% { box-shadow: 0 0 28px rgba(245,166,35,0.55), 0 8px 24px rgba(0,0,0,0.5); }
      50%     { box-shadow: 0 0 44px rgba(245,166,35,0.80), 0 8px 28px rgba(0,0,0,0.5); }
    }
    @keyframes live-pulse {
      0%,100% { opacity: 1; transform: scale(1); }
      50%     { opacity: 0.4; transform: scale(0.75); }
    }
    @keyframes typing-dot {
      0%,100% { transform: translateY(0); opacity: 0.5; }
      50%     { transform: translateY(-4px); opacity: 1; }
    }
