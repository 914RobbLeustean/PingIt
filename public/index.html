<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PingIt — What's happening near you</title>
<meta property="og:title" content="PingIt — What's happening near you">
<meta property="og:description" content="Real-time, ephemeral, location-based social discovery for Cluj-Napoca.">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #0a0a0f;
    color: #f5f5f7;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
  }
  .wordmark {
    font-size: 15px;
    font-weight: 800;
    letter-spacing: 4px;
    color: #f5a623;
    text-transform: uppercase;
    margin-bottom: 16px;
  }
  h1 {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: -0.5px;
    margin-bottom: 10px;
  }
  p {
    font-size: 15px;
    color: #8a8a98;
    line-height: 1.6;
    max-width: 420px;
    margin: 0 auto 28px;
  }
  .btn {
    display: inline-block;
    padding: 16px 36px;
    border-radius: 999px;
    background: #f5a623;
    color: #000;
    font-size: 15px;
    font-weight: 700;
    text-decoration: none;
    box-shadow: 0 6px 24px rgba(245, 166, 35, 0.3);
  }
</style>
</head>
<body>
<div>
  <div class="wordmark">PingIt</div>
  <h1>What's happening near you</h1>
  <p>Drop a ping, start something. Real-time, ephemeral, location-based social discovery for Cluj-Napoca students.</p>
  <a class="btn" href="https://apps.apple.com/app/pingit">Download for iOS</a>
</div>
</body>
</html>
